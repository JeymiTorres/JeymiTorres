<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Jeymi Torres · Analista de Datos · Automatización · Inteligencia Artificial">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1026"/>
      <stop offset="0.55" stop-color="#151B45"/>
      <stop offset="1" stop-color="#2A1450"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.75"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.4" r="0.45">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <style>
      .t { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .line { stroke-dasharray: 900; stroke-dashoffset: 900; animation: draw 2.4s ease-out forwards; }
      .pulse { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .grow { transform-box: fill-box; transform-origin: bottom; animation: grow 1.2s ease-out both; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes pulse { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.35); } }
      @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow)"/>

  <!-- Texto -->
  <g class="t">
    <text x="70" y="96" fill="#22D3EE" font-size="18" font-weight="600" letter-spacing="4">HOLA, SOY</text>
    <text x="68" y="160" fill="#FFFFFF" font-size="62" font-weight="700">Jeymi Torres</text>
    <rect x="70" y="182" width="96" height="4" rx="2" fill="url(#accent)"/>
    <text x="70" y="226" fill="#E2E8F0" font-size="24" font-weight="500">Analista de Datos · Automatización · IA</text>
    <text x="70" y="262" fill="#94A3B8" font-size="17">Transformando datos y procesos en soluciones inteligentes</text>
  </g>

  <!-- Panel de dashboard -->
  <g transform="translate(720,52)">
    <rect width="420" height="216" rx="14" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <circle cx="20" cy="20" r="4" fill="#F87171"/>
    <circle cx="34" cy="20" r="4" fill="#FBBF24"/>
    <circle cx="48" cy="20" r="4" fill="#34D399"/>

    <!-- Tarjetas KPI -->
    <g class="t">
      <rect x="20" y="38" width="120" height="50" rx="8" fill="#FFFFFF" fill-opacity="0.06"/>
      <text x="32" y="58" fill="#94A3B8" font-size="11">Precisión</text>
      <text x="32" y="79" fill="#FFFFFF" font-size="18" font-weight="700">99.9%</text>
      <rect x="150" y="38" width="120" height="50" rx="8" fill="#FFFFFF" fill-opacity="0.06"/>
      <text x="162" y="58" fill="#94A3B8" font-size="11">Expedientes</text>
      <text x="162" y="79" fill="#FFFFFF" font-size="18" font-weight="700">3,265</text>
      <rect x="280" y="38" width="120" height="50" rx="8" fill="#FFFFFF" fill-opacity="0.06"/>
      <text x="292" y="58" fill="#94A3B8" font-size="11">Horas ahorradas</text>
      <text x="292" y="79" fill="#FFFFFF" font-size="18" font-weight="700">6 h/sem</text>
    </g>

    <!-- Barras -->
    <g transform="translate(20,104)">
      <line x1="0" y1="96" x2="180" y2="96" stroke="#FFFFFF" stroke-opacity="0.15"/>
      <rect class="grow" x="6"   y="56" width="18" height="40" rx="3" fill="url(#bar)" style="animation-delay:.1s"/>
      <rect class="grow" x="34"  y="40" width="18" height="56" rx="3" fill="url(#bar)" style="animation-delay:.2s"/>
      <rect class="grow" x="62"  y="48" width="18" height="48" rx="3" fill="url(#bar)" style="animation-delay:.3s"/>
      <rect class="grow" x="90"  y="26" width="18" height="70" rx="3" fill="url(#bar)" style="animation-delay:.4s"/>
      <rect class="grow" x="118" y="34" width="18" height="62" rx="3" fill="url(#bar)" style="animation-delay:.5s"/>
      <rect class="grow" x="146" y="12" width="18" height="84" rx="3" fill="url(#bar)" style="animation-delay:.6s"/>
    </g>

    <!-- Línea de tendencia -->
    <g transform="translate(212,104)">
      <line x1="0" y1="96" x2="188" y2="96" stroke="#FFFFFF" stroke-opacity="0.15"/>
      <path d="M0 50 L30 70 L60 44 L92 54 L124 22 L156 30 L188 6 L188 96 L0 96 Z" fill="#A78BFA" fill-opacity="0.12"/>
      <polyline class="line" points="0,50 30,70 60,44 92,54 124,22 156,30 188,6" fill="none" stroke="#A78BFA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle class="pulse" cx="188" cy="6" r="5" fill="#A78BFA"/>
    </g>
  </g>

  <!-- Flujo de automatización (decorativo) -->
  <g transform="translate(560,40)" opacity="0.85">
    <path d="M20 20 C 70 20, 70 120, 120 120" fill="none" stroke="url(#accent)" stroke-width="2" stroke-dasharray="4 6"/>
    <path d="M20 240 C 70 240, 70 140, 120 140" fill="none" stroke="url(#accent)" stroke-width="2" stroke-dasharray="4 6"/>
    <circle class="pulse" cx="20" cy="20" r="6" fill="#22D3EE"/>
    <circle class="pulse" cx="20" cy="240" r="6" fill="#22D3EE" style="animation-delay:1.2s"/>
    <path d="M146 130 H160" stroke="#A78BFA" stroke-width="2"/>
    <rect x="114" y="114" width="32" height="32" rx="8" fill="#151B45" stroke="#A78BFA" stroke-width="2"/>
    <path d="M124 130 l5 5 l9 -11" fill="none" stroke="#A78BFA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
