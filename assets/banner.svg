<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Jeymi Torres · Automatización con IA · Agentes · Datos">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1026"/>
      <stop offset="0.55" stop-color="#151B45"/>
      <stop offset="1" stop-color="#2A1450"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <style>
      .t { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .wire { stroke-dasharray: 6 6; animation: flow 1.2s linear infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .pop { animation: pop .6s ease-out both; transform-box: fill-box; transform-origin: center; }
      @keyframes flow { to { stroke-dashoffset: -24; } }
      @keyframes pulse { 0%,100% { opacity: .5; transform: scale(1); } 50% { opacity: 1; transform: scale(1.3); } }
      @keyframes pop { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: scale(1); } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow)"/>

  <!-- Texto -->
  <g class="t">
    <text x="70" y="92" fill="#22D3EE" font-size="18" font-weight="600" letter-spacing="4">HOLA, SOY</text>
    <text x="68" y="156" fill="#FFFFFF" font-size="62" font-weight="700">Jeymi Torres</text>
    <rect x="70" y="178" width="96" height="4" rx="2" fill="url(#accent)"/>
    <text x="70" y="222" fill="#E2E8F0" font-size="24" font-weight="500">Automatización con IA · Agentes · Datos</text>
    <text x="70" y="258" fill="#94A3B8" font-size="17">Flujos inteligentes que ahorran tiempo y reducen errores</text>
  </g>

  <!-- Flujo de automatización -->
  <g class="t" transform="translate(600,46)">
    <!-- cables -->
    <path class="wire" d="M150 58 H200" stroke="#7DD3FC" stroke-opacity="0.75" stroke-width="2.5" fill="none"/>
    <path class="wire" d="M350 58 C 380 58, 380 58, 400 58" stroke="#7DD3FC" stroke-opacity="0.75" stroke-width="2.5" fill="none"/>
    <path class="wire" d="M275 92 V128" stroke="#7DD3FC" stroke-opacity="0.75" stroke-width="2.5" fill="none"/>
    <path class="wire" d="M200 162 H150" stroke="#7DD3FC" stroke-opacity="0.75" stroke-width="2.5" fill="none"/>
    <path class="wire" d="M350 162 H400" stroke="#7DD3FC" stroke-opacity="0.75" stroke-width="2.5" fill="none"/>

    <!-- Nodo 1: Trigger -->
    <g class="pop" style="animation-delay:.05s">
      <rect x="0" y="24" width="150" height="68" rx="12" fill="#FFFFFF" fill-opacity="0.06" stroke="#22D3EE" stroke-opacity="0.6"/>
      <circle cx="26" cy="58" r="12" fill="#22D3EE" fill-opacity="0.18"/>
      <path d="M22 50 l8 0 l-6 8 l7 0 l-11 12 l3 -9 l-6 0 z" fill="#22D3EE"/>
      <text x="46" y="53" fill="#94A3B8" font-size="11">Trigger</text>
      <text x="46" y="72" fill="#FFFFFF" font-size="15" font-weight="600">Nueva solicitud</text>
    </g>

    <!-- Nodo 2: IA -->
    <g class="pop" style="animation-delay:.2s">
      <rect x="200" y="24" width="150" height="68" rx="12" fill="#A78BFA" fill-opacity="0.14" stroke="#A78BFA"/>
      <circle cx="226" cy="58" r="12" fill="#A78BFA" fill-opacity="0.25"/>
      <path d="M226 48 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 z" fill="#E9D5FF"/>
      <text x="246" y="53" fill="#C4B5FD" font-size="11">Agente IA</text>
      <text x="246" y="72" fill="#FFFFFF" font-size="15" font-weight="600">Clasifica</text>
    </g>

    <!-- Nodo 3: Acción -->
    <g class="pop" style="animation-delay:.35s">
      <rect x="400" y="24" width="150" height="68" rx="12" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.2"/>
      <circle cx="426" cy="58" r="12" fill="#34D399" fill-opacity="0.2"/>
      <path d="M420 58 l4 4 l9 -9" fill="none" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="446" y="53" fill="#94A3B8" font-size="11">Acción</text>
      <text x="446" y="72" fill="#FFFFFF" font-size="15" font-weight="600">Registra</text>
    </g>

    <!-- Nodo 4: Validación -->
    <g class="pop" style="animation-delay:.5s">
      <rect x="200" y="128" width="150" height="68" rx="12" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.2"/>
      <circle cx="226" cy="162" r="12" fill="#FBBF24" fill-opacity="0.2"/>
      <path d="M220 156 h12 M220 162 h12 M220 168 h8" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>
      <text x="246" y="157" fill="#94A3B8" font-size="11">Validación</text>
      <text x="246" y="176" fill="#FFFFFF" font-size="15" font-weight="600">Revisa datos</text>
    </g>

    <!-- Nodo 5: Notifica -->
    <g class="pop" style="animation-delay:.65s">
      <rect x="0" y="128" width="150" height="68" rx="12" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.2"/>
      <circle cx="26" cy="162" r="12" fill="#22D3EE" fill-opacity="0.18"/>
      <path d="M19 157 h14 v10 h-14 z M19 157 l7 6 l7 -6" fill="none" stroke="#22D3EE" stroke-width="1.8" stroke-linejoin="round"/>
      <text x="46" y="157" fill="#94A3B8" font-size="11">Notifica</text>
      <text x="46" y="176" fill="#FFFFFF" font-size="15" font-weight="600">Equipo</text>
    </g>

    <!-- Nodo 6: Reporte -->
    <g class="pop" style="animation-delay:.8s">
      <rect x="400" y="128" width="150" height="68" rx="12" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.2"/>
      <rect x="418" y="164" width="5" height="8" rx="1" fill="#22D3EE"/>
      <rect x="425" y="158" width="5" height="14" rx="1" fill="#22D3EE"/>
      <rect x="432" y="152" width="5" height="20" rx="1" fill="#A78BFA"/>
      <text x="446" y="157" fill="#94A3B8" font-size="11">Dashboard</text>
      <text x="446" y="176" fill="#FFFFFF" font-size="15" font-weight="600">KPIs</text>
    </g>

    <circle class="pulse" cx="175" cy="58" r="4" fill="#22D3EE"/>
    <circle class="pulse" cx="375" cy="58" r="4" fill="#A78BFA" style="animation-delay:.6s"/>
    <circle class="pulse" cx="375" cy="162" r="4" fill="#A78BFA" style="animation-delay:1.2s"/>

    <!-- Métricas -->
    <g>
      <rect x="0" y="216" width="176" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06"/>
      <text x="88" y="236" fill="#E2E8F0" font-size="13" text-anchor="middle">hasta 6 h/sem ahorradas</text>
      <rect x="187" y="216" width="176" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06"/>
      <text x="275" y="236" fill="#E2E8F0" font-size="13" text-anchor="middle">&gt;99.9% de precisión</text>
      <rect x="374" y="216" width="176" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06"/>
      <text x="462" y="236" fill="#E2E8F0" font-size="13" text-anchor="middle">3,265 expedientes</text>
    </g>
  </g>
</svg>
